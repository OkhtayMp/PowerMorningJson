name: Build PowerTTman

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build"
        required: true
        default: "v1.0.0"
        type: string

  push:
    tags:
      - "v*"

permissions:
  contents: write


jobs:

  # ==========================================================
  # Windows x64
  # ==========================================================

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "PowerTTman" `
            main.py

      - name: Rename executable
        shell: pwsh
        run: |
          Rename-Item `
            "dist\PowerTTman.exe" `
            "PowerTTman-Windows-x64.exe"

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist\PowerTTman-Windows-x64.exe")) {
            throw "Windows executable was not created."
          }

          Get-Item "dist\PowerTTman-Windows-x64.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: PowerTTman-Windows-x64
          path: dist/PowerTTman-Windows-x64.exe
          if-no-files-found: error


  # ==========================================================
  # Linux x64
  # ==========================================================

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Linux executable
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name "PowerTTman" \
            main.py

      - name: Rename executable
        run: |
          mv dist/PowerTTman \
             dist/PowerTTman-Linux-x64

          chmod +x \
            dist/PowerTTman-Linux-x64

      - name: Verify executable
        run: |
          test -f dist/PowerTTman-Linux-x64
          file dist/PowerTTman-Linux-x64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: PowerTTman-Linux-x64
          path: dist/PowerTTman-Linux-x64
          if-no-files-found: error


  # ==========================================================
  # macOS Apple Silicon
  # ==========================================================

  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS application
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name "PowerTTman" \
            main.py

      - name: Rename application
        run: |
          mv \
            dist/PowerTTman.app \
            dist/PowerTTman-macOS-arm64.app

      - name: Create ZIP
        run: |
          cd dist

          zip -r \
            PowerTTman-macOS-arm64.zip \
            PowerTTman-macOS-arm64.app

      - name: Verify application
        run: |
          test -d dist/PowerTTman-macOS-arm64.app
          test -f dist/PowerTTman-macOS-arm64.zip

      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v6
        with:
          name: PowerTTman-macOS-arm64
          path: dist/PowerTTman-macOS-arm64.zip
          if-no-files-found: error


  # ==========================================================
  # macOS Intel
  # ==========================================================

  build-macos-intel:
    name: Build macOS Intel
    runs-on: macos-15-intel

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS application
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name "PowerTTman" \
            main.py

      - name: Rename application
        run: |
          mv \
            dist/PowerTTman.app \
            dist/PowerTTman-macOS-Intel.app

      - name: Create ZIP
        run: |
          cd dist

          zip -r \
            PowerTTman-macOS-Intel.zip \
            PowerTTman-macOS-Intel.app

      - name: Verify application
        run: |
          test -d dist/PowerTTman-macOS-Intel.app
          test -f dist/PowerTTman-macOS-Intel.zip

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v6
        with:
          name: PowerTTman-macOS-Intel
          path: dist/PowerTTman-macOS-Intel.zip
          if-no-files-found: error


  # ==========================================================
  # Publish Release
  # ==========================================================

  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest

    needs:
      - build-windows
      - build-linux
      - build-macos-arm64
      - build-macos-intel

    steps:

      # ------------------------------------------------------
      # Download Windows
      # ------------------------------------------------------

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: PowerTTman-Windows-x64
          path: release-assets

      # ------------------------------------------------------
      # Download Linux
      # ------------------------------------------------------

      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: PowerTTman-Linux-x64
          path: release-assets

      # ------------------------------------------------------
      # Download macOS ARM64
      # ------------------------------------------------------

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v7
        with:
          name: PowerTTman-macOS-arm64
          path: release-assets

      # ------------------------------------------------------
      # Download macOS Intel
      # ------------------------------------------------------

      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v7
        with:
          name: PowerTTman-macOS-Intel
          path: release-assets

      # ------------------------------------------------------
      # Show downloaded files
      # ------------------------------------------------------

      - name: List release files
        shell: bash
        run: |
          echo "Release assets:"
          find release-assets -maxdepth 2 -type f -print

      # ------------------------------------------------------
      # Determine release tag
      # ------------------------------------------------------

      - name: Determine release tag
        id: release-tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------
      # Verify release tag
      # ------------------------------------------------------

      - name: Show release tag
        run: |
          echo "Release tag: ${{ steps.release-tag.outputs.tag }}"

      # ------------------------------------------------------
      # Publish / update GitHub Release
      # ------------------------------------------------------

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          files: |
            release-assets/PowerTTman-Windows-x64.exe
            release-assets/PowerTTman-Linux-x64
            release-assets/PowerTTman-macOS-arm64.zip
            release-assets/PowerTTman-macOS-Intel.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}