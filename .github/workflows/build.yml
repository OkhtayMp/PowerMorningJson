name: Build PowerTTman

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: |
          pyinstaller ^
            --noconfirm ^
            --clean ^
            --onefile ^
            --windowed ^
            --name PowerTTman ^
            main.py

      - name: Prepare artifact
        shell: powershell
        run: |
          Rename-Item `
            "dist\PowerTTman.exe" `
            "PowerTTman-Windows-x64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: dist/PowerTTman-Windows-x64.exe


  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name PowerTTman \
            main.py

      - name: Prepare artifact
        run: |
          mv dist/PowerTTman dist/PowerTTman-Linux-x64
          chmod +x dist/PowerTTman-Linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64
          path: dist/PowerTTman-Linux-x64


  build-macos-arm64:
    name: macOS ARM64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name PowerTTman \
            main.py

      - name: Package
        run: |
          mv dist/PowerTTman.app \
             dist/PowerTTman-macOS-arm64.app

          cd dist

          zip -r \
            PowerTTman-macOS-arm64.zip \
            PowerTTman-macOS-arm64.app

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-arm64
          path: dist/PowerTTman-macOS-arm64.zip


  build-macos-intel:
    name: macOS Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name PowerTTman \
            main.py

      - name: Package
        run: |
          mv dist/PowerTTman.app \
             dist/PowerTTman-macOS-Intel.app

          cd dist

          zip -r \
            PowerTTman-macOS-Intel.zip \
            PowerTTman-macOS-Intel.app

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-intel
          path: dist/PowerTTman-macOS-Intel.zip


  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest

    needs:
      - build-windows
      - build-linux
      - build-macos-arm64
      - build-macos-intel

    steps:

      - name: Download Windows
        uses: actions/download-artifact@v7
        with:
          name: windows-x64
          path: release-assets

      - name: Download Linux
        uses: actions/download-artifact@v7
        with:
          name: linux-x64
          path: release-assets

      - name: Download macOS ARM64
        uses: actions/download-artifact@v7
        with:
          name: macos-arm64
          path: release-assets

      - name: Download macOS Intel
        uses: actions/download-artifact@v7
        with:
          name: macos-intel
          path: release-assets

      - name: List assets
        run: |
          find release-assets -type f -maxdepth 2 -print

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/PowerTTman-Windows-x64.exe
            release-assets/PowerTTman-Linux-x64
            release-assets/PowerTTman-macOS-arm64.zip
            release-assets/PowerTTman-macOS-Intel.zip
          fail_on_unmatched_files: truegit add .github/workflows/build.yml